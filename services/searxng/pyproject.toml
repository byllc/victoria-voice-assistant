# Python environment for SearXNG, run natively from its source checkout (see
# services/searxng/README.md). Versions are copied from SearXNG's requirements.txt
# and requirements-server.txt at the pinned commit; update both together.
[project]
name = "victoria-searxng-runtime"
version = "0.1.0"
description = "Dependencies for the local SearXNG instance"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi==2026.10.23",
    "babel==2.18.0",
    "flask-babel==4.0.0",
    "flask==3.1.3",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "pygments==2.21.0",
    "python-dateutil==3.0.0",
    "pyyaml==6.0.3",
    "curl_cffi==0.17.0",
    "valkey==6.1.1",
    "markdown-it-py==4.2.0",
    "msgspec==0.22.0",
    "typer==0.27.3",
    "isodate==0.7.2",
    "whitenoise==6.12.0",
    "typing-extensions==4.16.0",
    "granian[pname]==2.8.5",
]

[tool.uv]
package = false
