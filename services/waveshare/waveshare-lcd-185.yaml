      - [0x29, 0x00]

script:
  - id: screen
    mode: restart
    parameters:
      mode: int
    then:
      - lambda: id(screen_mode) = mode;
      - if:
          condition:
            lambda: return mode == 0;
          then:
            - light.turn_off: backlight
          else:
            - component.update: screen_display
            - light.turn_on:
                id: backlight
                brightness: 100%
  # The turn ended: dark, unless the reply is still playing (its end turns it dark then). Not checking
  # voice_assistant.is_running here: it still reads true inside on_end.
  - id: screen_turn_ended
    then:
      - delay: 100ms
      - if:
          condition:
            not: media_player.is_announcing
          then:
            - script.execute:
                id: screen
                mode: 0
  # The reply finished playing: dark, unless a turn is still going (a follow-up question listens again).
  - id: screen_reply_ended
    then:
      - delay: 100ms
      - if:
          condition:
            not: voice_assistant.is_running
          then:
            - script.execute:
                id: screen
                mode: 0

i2c:
  id: bus_a
  sda: GPIO11
  scl: GPIO10

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: right  # as the working Spotpear (same board) config has it; if the assistant hears silence, try left

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
  - platform: mixer
    id: speaker_mixer
    output_speaker: i2s_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixer_input
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input

media_player:
  - platform: speaker
    id: speaker_media_player
    name: Media Player
    volume_min: 0.5
    volume_max: 0.9
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC  # the assistant sends 48 kHz mono FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    # Music is lowered by 20 dB while it speaks, as the Satellite1 firmware does.
    on_announcement:
      - script.execute:
          id: screen
          mode: 2
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 20
          duration: 0.0s
    on_idle:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: screen_reply_ended

micro_wake_word:
  id: mww
  microphone: mic
  stop_after_detection: false
  models:
    - model: ../satellite1/wake_words/victoria.json
      id: victoria
    - model: ../satellite1/wake_words/hey_viki.json
      id: hey_viki
  vad:
  on_wake_word_detected:
    - if:
        condition:
          lambda: return id(ringing);
        then:
          - lambda: id(ringing) = false;
          - media_player.stop:
              announcement: true
        else:
          - if:
              condition: voice_assistant.is_running
              then:
                - voice_assistant.stop:
              else:
                - script.execute:
                    id: screen
                    mode: 1
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_end:
    - script.execute: screen_turn_ended
  on_error:
    - script.execute: screen_turn_ended
  on_timer_finished:
    - lambda: id(ringing) = true;
    - repeat:
        count: 30  # about a minute, unless silenced by the button, the wake word or a cancel
        then:
          - if:
              condition:
                lambda: return id(ringing);
              then:
                - media_player.speaker.play_on_device_media_file:
                    media_file: timer_finished_sound
                    announcement: true
                - delay: 2s
  on_timer_cancelled:
    - lambda: id(ringing) = false;

binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - if:
          condition:
            lambda: return id(ringing);
          then:
            - lambda: id(ringing) = false;
            - media_player.stop:
                announcement: true
          else:
            - if:
                condition: voice_assistant.is_running
                then:
                  - voice_assistant.stop:
                else:
                  - script.execute:
                      id: screen
                      mode: 1
                  - voice_assistant.start:
