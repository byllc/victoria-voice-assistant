# A test satellite (Stage 13): the Waveshare ESP32-S3-LCD-1.85 with its speaker box, on ESPHome, for the checks
# that need a second satellite while only one Satellite1 exists. Not a Satellite1: no XMOS echo cancellation, one
# microphone, no LED ring (the assistant skips the pending light). The screen glows green from the wake word
# until the reply, blue while it speaks (replies, announcements, timers), and is dark otherwise.
#
# Pins from Waveshare's wiki (ESP32-S3-LCD-1.85): ICS-43434 microphone on I2S (WS 2, SCK 15, SD 39); PCM5101
# DAC and amplifier on I2S (LRCK 38, BCK 48, DIN 47); I2C on 11/10 (TCA9554 expander, RTC, IMU); 16 MB flash,
# 8 MB octal PSRAM; ST77916 360x360 screen on QSPI (CLK 40, D0-D3 46/45/42/41, CS 21, reset on the expander's
# EXIO2 = pin 1, backlight 5), started with Waveshare's own ST77916 init sequence (vendor_specific_init_new, as in their demo). The BOOT button (GPIO0) starts or stops a turn and silences a ringing timer.
#
# Same key (SATELLITE1_API_KEY) and wake words ("Victoria", "Hey Viki") as our Satellite1 build. build.sh writes
# secrets.yaml next to this file from the Keychain.

esphome:
  name: victoria-waveshare
  friendly_name: Victoria Waveshare
  min_version: 2025.5.0
  on_boot:
    - priority: -100
      then:
        - script.execute:
            id: screen
            mode: 0

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - micro_wake_word.start:
  # Any client leaving fires this (an `esphome logs` session too), so stop listening only when none is left.
  on_client_disconnected:
    - if:
        condition:
          not: api.connected
        then:
          - voice_assistant.stop:
          - micro_wake_word.stop:

ota:
  - platform: esphome

# Wi-Fi is set on the device, not in this file: Improv over USB (web.esphome.io) or Bluetooth (improv-wifi.com).
wifi:
  ap: {}
captive_portal:
improv_serial:
esp32_improv:
  authorizer: none

globals:
  - id: ringing
    type: bool
    initial_value: "false"

  - id: screen_mode  # 0 dark, 1 green (heard the wake word), 2 blue (speaking)
    type: int
    initial_value: "0"

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO5

light:
  - platform: monochromatic
    id: backlight
    output: backlight_output
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

pca9554:
  - id: expander

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO40
  data_pins: [GPIO46, GPIO45, GPIO42, GPIO41]

display:
  - platform: qspi_dbi
    id: screen_display
    model: CUSTOM
    spi_id: display_qspi
    data_rate: 80MHz
    color_order: RGB
    invert_colors: true
    dimensions:
      width: 360
      height: 360
    cs_pin: GPIO21
    reset_pin:
      pca9554: expander
      number: 1  # EXIO2: Waveshare counts EXIO1-8, the expander pins 0-7 (EXIO1 is the touch reset)
    auto_clear_enabled: false
    update_interval: never
    lambda: |-
      switch (id(screen_mode)) {
        case 1: it.fill(Color(0, 200, 60)); break;
        case 2: it.fill(Color(0, 90, 255)); break;
        default: it.fill(Color::BLACK);
