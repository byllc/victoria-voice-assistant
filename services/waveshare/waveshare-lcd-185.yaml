# A test satellite (Stage 13): the Waveshare ESP32-S3-LCD-1.85 with its speaker box, on ESPHome, for the checks
# that need a second satellite while only one Satellite1 exists. Not a Satellite1: no XMOS echo cancellation, one
# microphone, no LED ring (the assistant skips the pending light), and the screen is left off for now.
#
# Pins from Waveshare's wiki (ESP32-S3-LCD-1.85): ICS-43434 microphone on I2S (WS 2, SCK 15, SD 39); PCM5101
# DAC and amplifier on I2S (LRCK 38, BCK 48, DIN 47); I2C on 11/10 (TCA9554 expander, RTC, IMU); 16 MB flash,
# 8 MB octal PSRAM. The BOOT button (GPIO0) starts or stops a turn and silences a ringing timer.
#
# Same key (SATELLITE1_API_KEY) and wake words ("Victoria", "Hey Viki") as our Satellite1 build. build.sh writes
# secrets.yaml next to this file from the Keychain.

esphome:
  name: victoria-waveshare
  friendly_name: Victoria Waveshare
  min_version: 2025.5.0
  on_boot:
    - priority: -100
      then:
        - output.turn_off: backlight

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:

ota:
  - platform: esphome

# Wi-Fi is set on the device, not in this file: Improv over USB (web.esphome.io) or Bluetooth (improv-wifi.com).
wifi:
  ap: {}
captive_portal:
improv_serial:
esp32_improv:
  authorizer: none

globals:
  - id: ringing
    type: bool
    initial_value: "false"

output:
  - platform: ledc
    id: backlight
    pin: GPIO5

i2c:
  id: bus_a
  sda: GPIO11
  scl: GPIO10

i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO2
    i2s_bclk_pin: GPIO15
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO38
    i2s_bclk_pin: GPIO48

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO39
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: right  # as the working Spotpear (same board) config has it; if the assistant hears silence, try left

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO47
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
  - platform: mixer
    id: speaker_mixer
    output_speaker: i2s_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixer_input
        timeout: never
      - id: media_mixer_input
        timeout: never
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mixer_input
  - platform: resampler
    id: media_resampler
    output_speaker: media_mixer_input

media_player:
  - platform: speaker
    id: speaker_media_player
    name: Media Player
    volume_min: 0.5
    volume_max: 0.9
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC  # the assistant sends 48 kHz mono FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 2
    files:
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    # Music is lowered by 20 dB while it speaks, as the Satellite1 firmware does.
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 20
          duration: 0.0s
    on_idle:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 1.0s

micro_wake_word:
  id: mww
  microphone: mic
  stop_after_detection: false
  models:
    - model: ../satellite1/wake_words/victoria.json
      id: victoria
    - model: ../satellite1/wake_words/hey_viki.json
      id: hey_viki
  vad:
  on_wake_word_detected:
    - if:
        condition:
          lambda: return id(ringing);
        then:
          - lambda: id(ringing) = false;
          - media_player.stop:
              announcement: true
        else:
          - if:
              condition: voice_assistant.is_running
              then:
                - voice_assistant.stop:
              else:
                - voice_assistant.start:
                    wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_timer_finished:
    - lambda: id(ringing) = true;
    - repeat:
        count: 30  # about a minute, unless silenced by the button, the wake word or a cancel
        then:
          - if:
              condition:
                lambda: return id(ringing);
              then:
                - media_player.speaker.play_on_device_media_file:
                    media_file: timer_finished_sound
                    announcement: true
                - delay: 2s
  on_timer_cancelled:
    - lambda: id(ringing) = false;

binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - if:
          condition:
            lambda: return id(ringing);
          then:
            - lambda: id(ringing) = false;
            - media_player.stop:
                announcement: true
          else:
            - if:
                condition: voice_assistant.is_running
                then:
                  - voice_assistant.stop:
                else:
                  - voice_assistant.start:
