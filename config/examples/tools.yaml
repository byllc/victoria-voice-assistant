# Tools the fast model may call. Reloaded on save; an invalid tool becomes an
# automatic stub (see `assistant tools status`) instead of rejecting the file.
#
# Kinds: builtin (timers, weather), python (`service: package.module:function`),
# http (`http:` section), stub. mcp, ha_service and ha_script become automatic
# stubs until their stage. Params take JSON Schema; `required: true` marks one
# required. reply: { template: true } speaks the tool's own text,
# { template: "..." } formats a string, { silent: true } says nothing; the
# default is the model phrasing the result (a second model call).
tools:
  - name: timer
    description: Start, cancel, change, stop, or check named countdown timers. Call it even when no timer name was given; it asks which one if that matters.
    kind: builtin
    service: timers
    params:
      action:
        type: string
        enum: [start, cancel, add_time, remove_time, status, stop]
        description: what to do
        required: true
      name:
        type: string
        description: "timer name as said, e.g. pasta or laundry; leave out if none was said "
      duration:
        type: string
        description: "e.g. 10 minutes, 1 hour 30 minutes; for start, add_time, remove_time"
    reply: { template: true }  # spoken by the timer service, no second model call
    examples:
      - set a pasta timer for 10 minutes
      - how long is left on the laundry
      - cancel the pasta timer
      - add 5 minutes to the rice timer
      - what timers do I have

  - name: weather
    description: Current conditions and forecast for home or a named place.
    kind: builtin
    service: weather
    params:
      location:
        type: string
        description: "a named place; leave out for home"
      when:
        type: string
        description: "now, today, tonight, tomorrow, a weekday, weekend, or week"
    timeout_s: 5
    examples:
      - what's the weather tomorrow
      - do I need an umbrella
      - weather in Boston this weekend

  - name: clock
    description: The current local time and date.
    kind: python
    service: victoria_voice_assistant.tools.local:current_time
    reply: { template: true }
    examples:
      - what time is it

  - name: web_search
    description: Search the web for current facts, news, scores, hours, prices. Returns short snippets.
    kind: builtin
    service: search
    params:
      query:
        type: string
        description: what to search for
        required: true
    timeout_s: 4
    examples:
      - who won the Red Sox game last night
      - what time does Home Depot close today
      - what's the latest news about the Artemis mission

  - name: web_read
    description: Read one web page from a search result when the snippets don't answer the question.
    kind: builtin
    service: search.read
    params:
      url:
        type: string
        description: a result URL from web_search
        required: true
    timeout_s: 6

  - name: home_control
    description: "Control or check lights, switches, climate and scenes at home (not locks): turn on or off, set brightness or temperature, or check whether something is on."
    kind: mcp                        # Home Assistant's MCP Server integration (Stage 9)
    mcp_server: homeassistant
    service: home_assistant          # maps action/target/value onto Home Assistant's intents
    entities: { label: voice }       # only entities with the `voice` label can be controlled
    reply: { template: true }        # "Turned on the bedroom light." (no second model call)
    params:
      action:
        type: string
        description: turn_on, turn_off, set, or query
      target:
        type: string
        description: device, room, or area
      value:
        type: string
        description: brightness, temperature, etc.
    notice: "Home control isn't set up yet. I've sent the setup steps to the chat."
    setup: >
      Install Home Assistant's "Model Context Protocol Server" integration, set its URL under
      mcp_servers.homeassistant in tools.yaml, store a long-lived access token with
      `uv run assistant secrets set HA_TOKEN`, and put the `voice` label on the devices to control
      (docs/home-assistant.md).
    examples:
      - turn off the kitchen lights
      - is the heat on upstairs

  - name: lock_door
    description: Lock a door at home, for example the front door.
    kind: ha_service
    service: lock.lock
    mcp_server: homeassistant        # the Home Assistant connection (URL and token)
    entities: { label: voice, domains: [lock] }
    confirm: true
    params:
      target:
        type: string
        description: which door, for example front door
    reply: { template: "{name} is locked." }
    examples:
      - lock the front door

  - name: music
    description: "Music and what's playing: play, pause, resume, skip this song (next), go back, change the volume, or say what's playing."
    kind: builtin
    service: music                   # Music Assistant (Stage 10)
    reply: { template: true }        # "Playing Kind of Blue by Miles Davis from Plex on the Exercise room speaker."
    params:
      action:
        type: string
        description: play, pause, resume, next, previous, volume, volume_up, volume_down, now_playing, stop
      query:
        type: string
        description: artist, album, track, playlist, or genre
      source:
        type: string
        description: plex or spotify, only if the user names one
      room:
        type: string
        description: where to play, only if the user says (a room or speaker name)
      level:
        type: integer
        description: volume 0-100, for action volume
    notice: "Music isn't set up yet. I've sent the setup steps to the chat."
    setup: >
      Point `music.server` in tools.yaml at Music Assistant (for example the Home Assistant add-on on
      port 8095) and store a Music Assistant long-lived token with
      `uv run assistant secrets set MUSIC_ASSISTANT_TOKEN` (docs/music.md).
    examples:
      - play some Miles Davis
      - skip this

  # An http tool: GET a URL with arguments filled in, then speak a template.
  # - name: sunrise
  #   description: Sunrise and sunset times at home today.
  #   kind: http
  #   http:
  #     url: https://api.sunrise-sunset.org/json
  #     query: { lat: "40.7", lng: "-74.0", formatted: "1" }
  #   reply: { template: "Sunrise is at {results[sunrise]} UTC." }

search:
  provider: searxng
  url: http://127.0.0.1:8888
  engines: [duckduckgo, brave, wikipedia]
  max_results: 3
  snippet_chars: 300
  cache_ttl_s: 600
  browser_fallback: bing   # when SearXNG is down or all its engines fail, search here in the headless browser
  read:
    fetcher: auto
    max_chars: 4000
    browser_pool: 2
    block: [image, font, media, stylesheet]

weather:
  provider: open-meteo
  home:
    name: Home
    lat: 0      # set to our location
    lon: 0
  units: imperial
  cache_ttl_s: 600

timers:
  max_per_device: 10
  ring_max_s: 300
  sound: chime.flac

notifications:                    # architecture §10.3
  quiet_hours: { start: "00:00", end: "08:00" }   # no sound: screen and badge only (timers still ring)
  default_style: ask_first        # ask_first | speak_summary | chime_only (agents can override with `notify`)
  mention_pending_after_reply: true
  question_timeout_min: 30
  expire_after_h: 24
  web_push: false                 # phone alerts; needs HTTPS and `assistant push keys` (docs/push.md)
  vapid_private_key: ${VAPID_PRIVATE_KEY:-}
  vapid_subject: mailto:you@example.com   # a contact for the push services

music:                             # Music Assistant (docs/music.md)
  server: http://homeassistant.local:8095
  token: "${MUSIC_ASSISTANT_TOKEN:-}"
  source_order: [plex, spotify]    # searched in this order unless the request names a source
  rooms: {}                        # optional: room names and aliases for players, and a satellite's room
  #  exercise room: { player: Exercise room speaker, aliases: [gym] }
  #  office: { player: Bill's Mac mini, satellite: office-sat }
  duck_level: 20                   # music volume while someone talks to the assistant

mcp_servers:
  homeassistant: { url: http://homeassistant.local/api/mcp, token: "${HA_TOKEN:-}" }   # Home Assistant's MCP Server integration

tests:
  - { say: "set a timer", expect: clarify }               # no duration given
  - { say: "cancel the timer", expect: clarify, given: { timers: [pasta, laundry] } }
  - { say: "cancel the timer", expect: "tool:timer", given: { timers: [pasta] } }
  - { say: "turn off the kitchen lights", expect: "tool:home_control" }
  - { say: "turn on the bedroom light", expect: "tool:home_control" }
  - { say: "is the bedroom light on", expect: "tool:home_control" }
  - { say: "set the piano light to 40 percent", expect: "tool:home_control" }
  - { say: "lock the front door", expect: "tool:lock_door" }
  - { say: "play Footprints from Plex in the exercise room", expect: "tool:music" }
  - { say: "turn the music down", expect: "tool:music" }
  - { say: "what song is this", expect: "tool:music" }
  - { say: "ask alexa to play some jazz", expect: "agent:alexa" }
  - { say: "ask helper what to make with leeks", expect: "agent:helper" }
  - { say: "book me a flight to Denver", expect: offer_agent }
  - { say: "what is helper working on", expect: "tool:tasks" }
  - { say: "is the meal plan done yet", expect: "tool:tasks" }
  - { say: "any notifications", expect: "tool:notifications" }
  - { say: "what did hermes say", expect: "tool:notifications" }
  - { say: "do not disturb until 8 a.m.", expect: "tool:notifications" }
  - { say: "cancel the research task", expect: "tool:tasks" }
  - { say: "how many ounces are in a cup", expect: answer }
  - { say: "what's the score of the Celtics game", expect: "tool:web_search" }
