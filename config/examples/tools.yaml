# Tools the fast model may call. Reloaded on save; an invalid tool becomes an
# automatic stub (see `assistant tools status`) instead of rejecting the file.
#
# Kinds: builtin (timers, weather, search, music), python (`service: package.module:function`),
# http (`http:` section), mcp and ha_service (Home Assistant; docs/home-assistant.md), stub.
# ha_script is not built yet and becomes an automatic stub. Params take JSON Schema; `required: true` marks one
# required. reply: { template: true } speaks the tool's own text,
# { template: "..." } formats a string, { silent: true } says nothing; the
# default is the model phrasing the result (a second model call).
tools:
  - name: timer
    description: Start, cancel, change, stop, or check countdown timers the user set on Victoria. Call it even when no timer name was given; it asks which one if that matters. Not for calendar events, appointments or meetings (cancelling, moving or lengthening those is the calendar tool).
    kind: builtin
    service: timers
    forget_after_s: 0                # the timer service holds the state; time left is always asked for again
    params:
      action:
        type: string
        enum: [start, cancel, add_time, remove_time, status, stop]
        description: what to do
        required: true
      name:
        type: string
        description: "timer name as said, e.g. pasta or laundry; leave out if none was said "
      duration:
        type: string
        description: "e.g. 10 minutes, 1 hour 30 minutes; for start, add_time, remove_time"
    reply: { template: true }  # spoken by the timer service, no second model call
    examples:
      - set a pasta timer for 10 minutes
      - how long is left on the laundry
      - cancel the pasta timer
      - add 5 minutes to the rice timer
      - what timers do I have

  - name: weather
    description: Current conditions and forecast for home or a named place.
    kind: builtin
    service: weather
    forget_after_s: 600              # a forecast stays in the conversation for 10 minutes, then is asked for again
    params:
      location:
        type: string
        description: "a named place; leave out for home"
      when:
        type: string
        description: "now, today, tonight, tomorrow, a weekday, weekend, or week"
    timeout_s: 5
    examples:
      - what's the weather tomorrow
      - do I need an umbrella
      - weather in Boston this weekend

  - name: clock
    description: The current local time and date.
    kind: python
    service: victoria_voice_assistant.tools.local:current_time
    forget_after_s: 0                # the time goes out of date at once: never repeated from the conversation
    reply: { template: true }
    examples:
      - what time is it

  - name: spend
    description: How much money has been spent on paid agents such as Claude, this month or last month. Not for prices of things or shopping.
    kind: builtin
    service: spend                   # the spend log (docs/claude-setup.md); works before any paid agent is set up
    forget_after_s: 0                # the total changes with every paid call: never repeated from the conversation
    params:
      agent:
        type: string
        description: "the agent asked about, e.g. claude; leave out for all agents"
      month:
        type: string
        enum: [this, last]
        description: "this month (the default) or last month"
    reply: { template: true }
    examples:
      - how much have we spent on Claude this month
      - what did Claude cost last month

  - name: history
    description: Look up what was asked or said to the assistant in the last week, e.g. what did I ask this morning, when did I last turn on the bedroom light.
    kind: builtin
    service: history                 # the command history; looks back `history.search_days` (below)
    params:
      words:
        type: string
        description: "words from the request, e.g. bedroom light; leave out to list the latest"
      room:
        type: string
        description: "a room or device, only if the user names one"
      when:
        type: string
        enum: [last_hour, today, this_morning, this_afternoon, this_evening, last_night, yesterday, this_week]
        description: "only if the user says when"
    examples:
      - what did I ask you this morning
      - when did I last turn on the bedroom light
      - what did I ask the kitchen yesterday

  - name: reminders
    description: Apple Reminders. Add a reminder, say what's on a list or due, or mark one done when the user says they did it. Not for groceries or the shopping list.
    kind: builtin
    service: reminders               # only the lists named under `reminders:` (below)
    forget_after_s: 120              # kept 2 min so "show me 4" follows a listing; the tool holds the numbers and rereads Reminders
    reply: { template: true }        # the tool's own text, numbered lists included (no second model call)
    params:
      action:
        type: string
        enum: [add, list, complete, lists]
        description: "add: a new reminder. list: what's on a list or due. complete: the user says they did it (I called the plumber, I paid the water bill). Groceries and the shopping list are the groceries tool. lists: which lists there are"
        required: true
      title:
        type: string
        description: "what the reminder says, e.g. call the plumber, milk (for add and complete); or its number from the last numbered list, e.g. 2"
      due:
        type: string
        description: "when it's due, as the user said it, e.g. tomorrow at 9, Friday, in 2 hours (add only)"
      list:
        type: string
        description: "the list as the user said it, e.g. groceries; or its number from the last numbered list, e.g. 4"
      when:
        type: string
        enum: [today, overdue, this_week]
        description: "for list: only reminders due today, overdue, or this week"
    examples:
      - remind me to call the plumber tomorrow at 9
      - add renew the car registration to the household list
      - what's on the household list
      - what are my reminders today
      - I paid the water bill
      - what lists do you have
      - show me the household list
      - show me number 4
      - number 2 is done

  - name: calendar
    description: The user's calendar. Anything the user names that has a day and a time and isn't a timer is an event here, whatever it is called. Say what's on it, when an event is, tell them about one, say when they're free, add one, or move, lengthen, rename, cancel or delete one. Not for reminders or to-dos.
    kind: builtin
    service: calendar                # the Mac's calendars, minus `calendar.skip` (below); docs/calendar.md
    forget_after_s: 120              # kept 2 min so "move number 2" follows a listing; the tool holds the numbers and rereads the calendar
    reply: { template: true }        # the tool's own text (no second model call)
    params:
      action:
        type: string
        enum: [list, next, find, details, free, calendars, add, change, delete]
        description: "list: what's on a day or a stretch of days. next: the next event. find: when a named event is (never for cancelling or changing one). details: tell me about it, where it is, its notes, who's invited. free: am I free, when am I free. calendars: which calendars there are. add: a new event. change: move, push, lengthen, shorten, rename or edit one (asks before it's done). delete: cancel or delete one (asks before it's done)"
        required: true
      title:
        type: string
        description: "the event's name, e.g. dentist, lunch with Sam; or its number from the last numbered list, e.g. 2. Needed for find, details, add, change and delete"
      when:
        type: string
        description: "as the user said it. For add: when it starts, e.g. Friday at noon, tomorrow at 9, November 20 (no time means all day). For list and free: the day or stretch, e.g. today, tomorrow, Friday afternoon, this week, next week, this weekend. For find, change and delete: the day the event is on, when said"
      end:
        type: string
        description: "when it ends, as said, e.g. at 3, 5:30 pm, Sunday (add and change)"
      duration:
        type: string
        description: "how long it is, as said, e.g. 2 hours, 90 minutes (add and change)"
      all_day:
        type: boolean
        description: "true for an all-day event (add)"
      calendar:
        type: string
        description: "the calendar's name whenever the user names one, e.g. family, work, Victoria Test (\"on the work calendar\", \"to the family calendar\")"
      location:
        type: string
        description: "where it is (add and change)"
      notes:
        type: string
        description: "notes for the event (add and change)"
      alert:
        type: string
        description: "how long before to alert, e.g. 15 minutes, 1 hour (add and change)"
      repeat:
        type: string
        enum: [daily, weekdays, weekly, monthly, yearly]
        description: "how the new event repeats (add)"
      new_title:
        type: string
        description: "the event's new name when renaming, e.g. orthodontist in 'rename the dentist to orthodontist' (change)"
      new_when:
        type: string
        description: "where to move it, as said, e.g. 3, 3:30 pm, Friday, tomorrow at 10 (change)"
      scope:
        type: string
        enum: [this, future]
        description: "for a repeating event, after the user answers: this one only, or this and all after it (change and delete)"
    examples:
      - what's on my calendar today
      - what do I have this week
      - when is the dentist
      - am I free Friday afternoon
      - add lunch with Sam Friday at noon
      - tell me about the dentist appointment
      - move the dentist to 3
      - cancel my haircut appointment
      - cancel book club
      - make the board meeting two hours long
      - rename the dentist to orthodontist

  - name: groceries
    description: The grocery list (also called the shopping list). Read it to answer questions (do we need carrots?), add what we need or are out of, check off what we got, or take an item off.
    kind: builtin
    service: reminders.list          # one Reminders list, read whole (feature 20261112-024118)
    list: Groceries                  # the Reminders list this tool reads and changes
    forget_after_s: 0                # Reminders holds the state; the list is read fresh every time
    params:
      action:
        type: string
        enum: [read, need, got, remove]
        description: "read: the whole list (for any question about it). need: add it, or we're out of it. got: we bought it or have it. remove: take it off the list"
        required: true
      item:
        type: string
        description: "the item as the user said it, e.g. ice cream; several separated by commas, e.g. carrots, milk, pizza (not for read)"
    examples:
      - do we need carrots
      - what's on the grocery list
      - what's on the shopping list
      - show me groceries
      - add milk to the shopping list
      - I bought the milk
      - add ice cream to groceries
      - we're out of pizza
      - we got the milk
      - take carrots off the grocery list

  - name: wine
    description: "Our wine cellar (CellarTracker): what wines we have, the best rated, what's from a region or grape, how many bottles, and which location and bin a wine is in. Also updates the wine list from CellarTracker on request, and keeps corrections for wine words that are misheard."
    kind: builtin
    service: cellartracker           # CellarTracker's export, saved for 24 hours (feature 20261114-162903; login: CT_USERNAME, CT_PASSWORD)
    forget_after_s: 0                # the saved list is read each time, so answers never go out of date
    params:
      action:
        type: string
        enum: [read, update, correct, corrections, forget]
        description: "read: the cellar's wines, best rated first, each with its bottles and where they are (for any question about our wine). update: fetch the wine list from CellarTracker now (only when asked to update or refresh it). correct: remember that a heard wine word means another (\"when I say tempra nioh I mean Tempranillo\"). corrections: list them. forget: drop one"
        required: true
      color:
        type: string
        enum: [red, white, rose]
        description: only wines of this colour (whites, reds, rosé)
      search:
        type: string
        description: "words to narrow by, as the user said them, all of them, even when they look misheard: wine or producer name, grape, region, vintage, location or bin, e.g. Ridge, Tempranillo, Barolo, 2019. Not words like best or highest rated (the list is already best first)"
      heard:
        type: string
        description: "the misheard words. For correct and forget. For read only when searching again after no_match: the words searched before, e.g. Nioh"
      meant:
        type: string
        description: "for correct: what the heard words mean, e.g. Tempranillo"
    examples:
      - what are our highest rated whites
      - what bin is the 2019 Lytton Springs in
      - do we have any Barolo
      - do we have any Tempranillo
      - how many bottles of wine do we have
      - update the wine list
      - when I say tempra nioh I mean Tempranillo
      - what wine corrections do you have

  - name: recipes
    description: Recipes. What a dish needs compared with the groceries we have, what we can make with what we have, or show a recipe. From the household's recipes folder, or the web when it isn't there.
    kind: builtin
    service: recipes                 # the recipes folder against the grocery list (settings under `recipes:`)
    forget_after_s: 0                # the grocery list changes; always worked out again
    params:
      action:
        type: string
        enum: [need, suggest, show, save]
        description: "need: what we have and lack for a dish. suggest: what we can make with what we have. show: the whole recipe. save: keep the web recipe just found"
        required: true
      recipe:
        type: string
        description: "the dish as the user said it, e.g. paella (for need and show)"
    examples:
      - what do I need to make paella
      - with the groceries I have what can I make
      - what can we make for dinner
      - show me the paella recipe
      - save that recipe

  - name: web_search
    description: Search the web for current facts, news, scores, hours, prices. Returns short snippets.
    kind: builtin
    service: search
    params:
      query:
        type: string
        description: what to search for
        required: true
    timeout_s: 4
    examples:
      - who won the Red Sox game last night
      - what time does Home Depot close today
      - what's the latest news about the Artemis mission

  - name: web_read
    description: Read one web page from a search result when the snippets don't answer the question.
    kind: builtin
    service: search.read
    params:
      url:
        type: string
        description: a result URL from web_search
        required: true
    timeout_s: 6

  - name: show_page
    description: "Open a web page on the right of the user's screen (the web interface only), e.g. a search result, a recipe, or a site the user names."
    kind: builtin
    service: show_page               # the web interface's document panel
    params:
      url:
        type: string
        description: the page's full web address
        required: true
      title:
        type: string
        description: a short name for the page

  - name: home_control
    description: "Control or check lights, switches, climate and scenes at home (not locks): turn on or off, set brightness or temperature, or check whether something is on."
    kind: mcp                        # Home Assistant's MCP Server integration (Stage 9)
    mcp_server: homeassistant
    service: home_assistant          # maps action/target/value onto Home Assistant's intents
    entities: { label: voice }       # only entities with the `voice` label can be controlled
    reply: { template: true }        # "Turned on the bedroom light." (no second model call)
    params:
      action:
        type: string
        description: turn_on, turn_off, set, or query
      target:
        type: string
        description: device, room, or area
      value:
        type: string
        description: brightness, temperature, etc.
    notice: "Home control isn't set up yet. I've sent the setup steps to the chat."
    setup: >
      Install Home Assistant's "Model Context Protocol Server" integration, set its URL under
      mcp_servers.homeassistant in tools.yaml, store a long-lived access token with
      `uv run assistant secrets set HA_TOKEN`, and put the `voice` label on the devices to control
      (docs/home-assistant.md).
    examples:
      - turn off the kitchen lights
      - is the heat on upstairs

  - name: lock_door
    description: Lock a door at home, for example the front door.
    kind: ha_service
    service: lock.lock
    mcp_server: homeassistant        # the Home Assistant connection (URL and token)
    entities: { label: voice, domains: [lock] }
    confirm: true
    params:
      target:
        type: string
        description: which door, for example front door
    reply: { template: "{name} is locked." }
    examples:
      - lock the front door

  - name: announce
    description: Say a message out loud on the satellites in other rooms, or everywhere ("announce dinner's ready", "tell the kitchen I'm on my way").
    kind: builtin
    service: announce                # Stage 13; a stub until voice satellites are set up
    reply: { template: true }        # "Announced everywhere."
    params:
      message:
        type: string
        description: the words to say, as the user put them (e.g. "dinner's ready")
        required: true
      rooms:
        type: string
        description: rooms to say it in, comma-separated; leave out for everywhere
    examples:
      - announce dinner's ready
      - tell the kitchen I'm on my way

  - name: music
    description: "Music and what's playing: play, pause, resume, skip this song (next), go back, change the volume, or say what's playing."
    kind: builtin
    service: music                   # Music Assistant (Stage 10)
    forget_after_s: 0                # Music Assistant holds the state; what's playing is always asked for again
    reply: { template: true }        # "Playing Kind of Blue by Miles Davis from Plex on the Exercise room speaker."
    params:
      action:
        type: string
        description: play, pause, resume, next, previous, volume, volume_up, volume_down, now_playing, stop
      query:
        type: string
        description: artist, album, track, playlist, or genre
      source:
        type: string
        description: plex or spotify, only if the user names one
      room:
        type: string
        description: where to play, only if the user says (a room or speaker name)
      level:
        type: integer
        description: volume 0-100, for action volume
    notice: "Music isn't set up yet. I've sent the setup steps to the chat."
    setup: >
      Point `music.server` in tools.yaml at Music Assistant (for example the Home Assistant add-on on
      port 8095) and store a Music Assistant long-lived token with
      `uv run assistant secrets set MUSIC_ASSISTANT_TOKEN` (docs/music.md).
    examples:
      - play some Miles Davis
      - skip this

  - name: upgrade
    description: Ask Hermes to add a feature to Victoria on an isolated branch for Bill to review.
    kind: builtin
    service: upgrade
    reply: { template: true }
    params:
      request:
        type: string
        description: the feature to add to Victoria
        required: true
    notice: "The upgrade agent isn't set up yet."
    setup: "Configure Hermes with the isolated checkout described in docs/hermes.md."
    examples:
      - add a feature to Victoria that lets me see recent searches
      - ask Hermes to add a dark theme setting

  # An http tool: GET a URL with arguments filled in, then speak a template.
  # - name: sunrise
  #   description: Sunrise and sunset times at home today.
  #   kind: http
  #   http:
  #     url: https://api.sunrise-sunset.org/json
  #     query: { lat: "40.7", lng: "-74.0", formatted: "1" }
  #   reply: { template: "Sunrise is at {results[sunrise]} UTC." }

search:
  provider: searxng
  url: http://127.0.0.1:8888
  engines: [duckduckgo, brave, wikipedia]
  max_results: 3
  snippet_chars: 300
  cache_ttl_s: 600
  browser_fallback: bing   # when SearXNG is down or all its engines fail, search here in the headless browser
  read:
    fetcher: auto
    max_chars: 4000
    browser_pool: 2
    block: [image, font, media, stylesheet]

weather:
  provider: open-meteo
  home:                            # personal, so kept as secrets: `assistant secrets set WEATHER_HOME_LAT` (and _LON)
    name: Home
    lat: "${WEATHER_HOME_LAT:-0}"
    lon: "${WEATHER_HOME_LON:-0}"
  units: imperial
  cache_ttl_s: 600

timers:
  max_per_device: 10
  ring_max_s: 300
  sound: chime.flac

history:                          # every request is kept in the database (no archive, nothing deleted)
  search_days: 7                  # how far back the history tool looks; `assistant history search` reads it all

reminders:                        # Apple Reminders on this Mac (macOS asks once for access: assistant reminders grant)
  lists: [Shopping, Household]    # only these lists are reached; `all` reaches every list in the signed-in account
  default_list: Household         # where "remind me to ..." goes (the first list when not set)

calendar:                         # the calendar tool: every calendar on this Mac (macOS asks once: assistant calendar grant)
  skip: []                        # calendars never read or written, e.g. [US Holidays, Birthdays]
  # default_calendar: Family      # where new events go; the Mac's default calendar when not set
  default_minutes: 60             # how long a new event is when no length is said
  free_from: 8                    # "am I free?" looks between these hours
  free_until: 22

recipes:                          # the recipes tool (docs/recipes.md)
  # folder: ~/Documents/Recipes   # where the recipe files are; `recipes/` next to the database when not set
  groceries_tool: groceries       # the list tool that says what we have
  have_days: 14                   # checked off the grocery list this recently counts as on hand
  staples: [salt, pepper, water, oil, olive oil, butter, sugar, flour]   # always counted as on hand

notifications:                    # architecture §10.3
  quiet_hours: { start: "00:00", end: "08:00" }   # no sound: screen and badge only (timers still ring)
  default_style: ask_first        # ask_first | speak_summary | chime_only (agents can override with `notify`)
  mention_pending_after_reply: true
  question_timeout_min: 30
  expire_after_h: 24
  web_push: false                 # phone alerts; needs HTTPS and `assistant push keys` (docs/push.md)
  vapid_private_key: ${VAPID_PRIVATE_KEY:-}
  vapid_subject: mailto:you@example.com   # a contact for the push services

music:                             # Music Assistant (docs/music.md)
  server: http://homeassistant.local:8095
  token: "${MUSIC_ASSISTANT_TOKEN:-}"
  source_order: [plex, spotify]    # searched in this order unless the request names a source
  duck_level: 20                   # music volume while someone talks to the assistant


# The device registry (Stage 13): what each room has. Satellites name their room below; music plays on a
# room's player, "turn off the lights" from a satellite means its room's Home Assistant area, and
# "ask Alexa" goes to its Echo. (The older `music.rooms` still works and is folded in.)
rooms: {}
#  exercise room: { player: Exercise room speaker, aliases: [gym] }
#  office: { player: Bill's Mac mini, area: Office, echo: media_player.office_echo }

# ESPHome voice satellites (Stage 12; docs/satellites.md). The name is the device name. The key is the
# device's API encryption key, set with `assistant secrets set SATELLITE1_API_KEY` (our build of its
# firmware uses it).
satellites: {}
#  office:
#    host: satellite1-xxxxxx.local
#    key: "${SATELLITE1_API_KEY:-}"
#    room: office      # its room in `rooms`; default: the room with its own name
#    arbitration_offset_db: 0   # added to its score when several satellites hear the same words
#    gain: 120         # its microphone is raised by this before speech detection
#    pending_color: "#FFA000"   # its LED ring while notifications are unread (null: leave it alone)
#    stream_replies: false      # true: it starts playing a reply after the first sentence (docs/satellites.md)
# satellite_audio_port: 8767   # where every satellite fetches replies (plain HTTP on the LAN)
# satellite_arbitration_s: 0.5 # how long to wait for other satellites waking on the same words

mcp_servers:
  homeassistant: { url: http://homeassistant.local/api/mcp, token: "${HA_TOKEN:-}" }   # Home Assistant's MCP Server integration

tests:
  - { say: "cancel the Zebra review", expect: "tool:calendar" }          # a name that doesn't sound like an appointment
  - { say: "make the Zebra checkpoint two hours long", expect: "tool:calendar" }
  - { say: "push lunch with Sam to 1:30", expect: "tool:calendar" }
  - { say: "what's on my calendar tomorrow", expect: "tool:calendar" }
  - { say: "make the laundry timer 20 minutes", expect: "tool:timer" }
  - { say: "set a timer", expect: clarify }               # no duration given
  - { say: "cancel the timer", expect: clarify, given: { timers: [pasta, laundry] } }
  - { say: "cancel the timer", expect: "tool:timer", given: { timers: [pasta] } }
  - { say: "turn off the kitchen lights", expect: "tool:home_control" }
  - { say: "turn on the bedroom light", expect: "tool:home_control" }
  - { say: "is the bedroom light on", expect: "tool:home_control" }
  - { say: "set the piano light to 40 percent", expect: "tool:home_control" }
  - { say: "lock the front door", expect: "tool:lock_door" }
  - { say: "what's on my calendar tomorrow", expect: "tool:calendar" }
  - { say: "add a dentist appointment Friday at 2", expect: "tool:calendar" }
  - { say: "play Footprints from Plex in the exercise room", expect: "tool:music" }
  - { say: "turn the music down", expect: "tool:music" }
  - { say: "what song is this", expect: "tool:music" }
  - { say: "add a feature to Victoria that lets me see recent searches", expect: "tool:upgrade" }
  - { say: "ask alexa to play some jazz", expect: "agent:alexa" }
  - { say: "ask helper what to make with leeks", expect: "agent:helper" }
  - { say: "book me a flight to Denver", expect: offer_agent }
  - { say: "what is helper working on", expect: "tool:tasks" }
  - { say: "is the meal plan done yet", expect: "tool:tasks" }
  - { say: "any notifications", expect: "tool:notifications" }
  - { say: "what did hermes say", expect: "tool:notifications" }
  - { say: "do not disturb until 8 a.m.", expect: "tool:notifications" }
  - { say: "cancel the research task", expect: "tool:tasks" }
  - { say: "how many ounces are in a cup", expect: answer }
  - { say: "what's the score of the Celtics game", expect: "tool:web_search" }
