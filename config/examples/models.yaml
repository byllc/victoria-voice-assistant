servers:
  lmstudio:
    type: openai
    base_url: http://127.0.0.1:1234/v1
    api_key: ${LMS_API_KEY}

models:
  fast:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true
  fast-small:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true

pools: {}

decider:
  type: llm_choice
  model: fast-small

roles:
  router: fast
  router_fallback: fast-small
  summarizer: fast
  pre_router: "off"
