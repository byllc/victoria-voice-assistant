servers:
  lmstudio:
    type: openai
    base_url: http://127.0.0.1:1234/v1
    api_key: ${LMS_API_KEY}

models:
  fast:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true
  fast-small:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true

pools: {}

decider:
  type: llm_choice
  model: fast-small

speech:                       # voice sessions (in-process)
  stt:
    model: mlx-community/whisper-large-v3-turbo
    language: en
  tts:
    voice: af_heart             # a Kokoro voice name
    speed: 1.0
  vad:
    confidence: 0.7
    start_s: 0.2
    stop_s: 0.2                 # Pipecat's recommendation with Smart Turn
  turn:
    smart_turn: true
    fallback_s: 1.8             # end the turn after this much silence regardless
    short_clip_s: 0.5           # shorter speech ("stop", "pause") skips Smart Turn; 0 = off

roles:
  router: fast
  router_fallback: fast-small
  summarizer: fast
  pre_router: "off"
