servers:
  lmstudio:
    type: openai
    base_url: http://127.0.0.1:1234/v1
    api_key: ${LMS_API_KEY}
  hermes:                     # any Hermes Agent gateway (docs/hermes.md); point base_url at yours
    type: openai
    base_url: http://127.0.0.1:8642/v1
    api_key: ${HERMES_API_KEY:-}   # that gateway's API_SERVER_KEY; optional until one is connected
  anthropic:                  # Claude, for the `claude` pool; optional until ANTHROPIC_API_KEY is set
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY:-}
  decider:                    # mlx-lm serving the decision model (`assistant decider run`); localhost only
    type: openai
    base_url: http://127.0.0.1:8090/v1

models:
  fast:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true
  fast-small:
    server: lmstudio
    model: google/gemma-4-12b
    params:
      temperature: 0.2
      max_tokens: 200
      reasoning_effort: none  # gemma-4 ignores low; none disables reasoning (first token ~0.6 s)
    timeout_s: 30
    pin: true

  decider:
    server: decider
    # The MLX weights folder mlx-lm loads; here, the copy LM Studio downloaded (don't also load it there).
    model: ~/.lmstudio/models/SirSahOl/Tev1-4B-experimental-chat-mlx-16bit
    timeout_s: 5

  hermes:
    server: hermes
    model: hermes-agent         # the gateway's API_SERVER_MODEL_NAME (hermes-agent unless it uses a profile)
    # Hermes streams nothing while it runs its own tools, and timeout_s is a stall timeout: allow long gaps.
    timeout_s: 300
  claude-haiku:
    server: anthropic
    model: claude-haiku-5-5
    params: { max_tokens: 1024 }
    price: { input: 0.10, output: 0.50 }   # USD per million tokens
  claude-sonnet:
    server: anthropic
    model: claude-sonnet-5-5
    params: { max_tokens: 1024 }
    price: { input: 2.00, output: 10.00 }
  claude-opus:
    server: anthropic
    model: claude-opus-5-5
    params: { max_tokens: 1024 }
    price: { input: 4.00, output: 20.00 }

pools:
  claude:                     # "Ask Claude" uses this pool
    members:                  # cheapest first
      - { model: claude-haiku,  good_for: "quick facts, short answers, simple rewrites, unit and date questions" }
      - { model: claude-sonnet, good_for: "explanations, planning, recipes, comparisons, multi-step questions" }
      - { model: claude-opus,   good_for: "hard reasoning, long research, careful writing, high-stakes questions" }
    default: claude-sonnet    # used if the decider is unsure or unavailable
    min_confidence: 0.6
    spoken_overrides:         # saying these picks a member directly ("ask Claude Opus to ...")
      opus: claude-opus
      sonnet: claude-sonnet
      haiku: claude-haiku
    escalate_on_failure: true # retry one step up if the cheaper model declines or fails
    budget:
      monthly_usd: 30
      downgrade_at: 0.8       # above 80% of budget, never pick above the default
      stop_at: 1.0            # at 100%, say so and offer the default agent instead

decider:
  type: decision_model        # Tev1-4B-experimental: one lettered choice, confidence from token probabilities
  server: decider
  model: decider
  # type: llm_choice          # alternative: a small LM Studio model answering a constrained question
  # model: fast-small

speech:                       # voice sessions (in-process)
  stt:
    model: mlx-community/whisper-large-v3-turbo
    language: en
  tts:
    voice: af_heart             # a Kokoro voice name
    speed: 1.0
  vad:
    confidence: 0.7
    start_s: 0.2
    stop_s: 0.2                 # Pipecat's recommendation with Smart Turn
  turn:
    smart_turn: true
    fallback_s: 1.8             # end the turn after this much silence regardless
    short_clip_s: 0.5           # shorter speech ("stop", "pause") skips Smart Turn; 0 = off

roles:
  router: fast
  router_fallback: fast-small
  summarizer: fast
  pre_router: "off"
