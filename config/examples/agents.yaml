default: helper
agents:
  - name: helper
    aliases: [helpr]
    kind: model
    model: fast
    system: You answer by voice for our household. Be brief and concrete.
    tools: []
    share_context: minimal
    mode: wait

  - name: hermes
    aliases: [herms]
    kind: harness               # runs its own tools (files and a shell, inside its container)
    model: hermes               # from models.yaml
    mode: auto                  # wait up to wait_s, then background
    wait_s: 8
    notify: ask_first           # a result that comes after wait_s: announced, then "Want to hear it?"

  # Optional cloud agent: a stub ("Claude isn't set up yet.") until ANTHROPIC_API_KEY is set. docs/claude-setup.md
  - name: claude
    aliases: [clod, cloud]      # common mis-transcriptions
    kind: model
    pool: claude                # the decider picks Haiku, Sonnet or Opus per request
    system: You answer by voice for our household. Be brief and concrete. No lists or formatting.
    tools: [weather, web_search, web_read]
    search: builtin
    share_context: minimal
    mode: auto
    wait_s: 8

  # "Ask Alexa to ...": the words go to an Echo through Home Assistant's Alexa Media Player integration.
  # The Echo answers or plays on its own; we only say "Asking Alexa." "Isn't set up yet" until it exists.
  - name: alexa
    aliases: [alexis]
    kind: relay
    via: ha_service                  # the Home Assistant connection: mcp_servers.homeassistant in tools.yaml
    service: media_player.play_media
    content_type: custom             # "run this as if spoken"
    targets: { kitchen: media_player.kitchen_echo }   # room → Echo (Alexa Media Player entity)
    reply: "Asking Alexa."
