default: helper
agents:
  - name: helper
    aliases: [helpr]
    kind: model
    model: fast
    system: You answer by voice for our household. Be brief and concrete.
    tools: []
    share_context: minimal
    mode: wait

  - name: hermes
    aliases: [herms]
    kind: harness               # runs its own tools (files and a shell, inside its container)
    model: hermes               # from models.yaml
    mode: auto                  # wait up to wait_s, then background
    wait_s: 8

  - name: claude
    aliases: [clod, cloud]      # common mis-transcriptions
    kind: model
    pool: claude                # the decider picks Haiku, Sonnet or Opus per request
    system: You answer by voice for our household. Be brief and concrete. No lists or formatting.
    tools: [weather, web_search, web_read]
    search: builtin
    share_context: minimal
    mode: auto
    wait_s: 8
